# ==============================================================================
# Backend Service
# ==============================================================================
# Exposes Flask backend pods externally via NodePort
# Frontend browser can access this service
# ==============================================================================

apiVersion: v1
kind: Service
metadata:
  name: flask-app-service
spec:
  type: NodePort  # External service (accessed by browser)
  selector:
    app: flask-app  # Matches pods with this label
  ports:
  - protocol: TCP
    port: 80        # Service port
    targetPort: 5000  # Container port (Flask)
    nodePort: 30080   # External access port