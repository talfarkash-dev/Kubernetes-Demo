# ==============================================================================
# Backend Service
# ==============================================================================
# Exposes Flask backend pods internally
# Port forwarding provides external access
# ==============================================================================

apiVersion: v1
kind: Service
metadata:
  name: flask-app-service
spec:
  type: ClusterIP  # Internal service (accessed via port-forward)
  sessionAffinity: None  # Ensures round-robin load balancing
  selector:
    app: flask-app  # Matches pods with this label
  ports:
  - protocol: TCP
    port: 5000        # Service port (matches Flask app)
    targetPort: 5000  # Container port (Flask)